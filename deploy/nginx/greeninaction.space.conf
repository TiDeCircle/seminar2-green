# GREEN IN ACTION — https://greeninaction.space
#
# Install:
#   sudo cp deploy/nginx/greeninaction.space.conf /etc/nginx/sites-available/greeninaction.space
#   sudo ln -s /etc/nginx/sites-available/greeninaction.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d greeninaction.space -d www.greeninaction.space
#
# The site itself is served by pm2 (`pm2 serve dist 3005 --name greeninaction`).

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.greeninaction.space;
    return 301 http://greeninaction.space$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name greeninaction.space;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
